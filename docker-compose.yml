# ═══════════════════════════════════════════════════════════════════════════
#  docker-compose.yml — Déploiement sécurisé DevSecOps
#  Usage  : docker compose up -d
#  Secrets : via fichier .env (jamais commité en production)
# ═══════════════════════════════════════════════════════════════════════════

version: '3.9'

# ─── Réseau isolé ─────────────────────────────────────────────────────────────
networks:
  devsecops-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/24

# ─── Volumes persistants ──────────────────────────────────────────────────────
volumes:
  prometheus-data:
  grafana-data:

services:

  # ── Application FastAPI ──────────────────────────────────────────────────
  app:
    image: ${HARBOR_URL}/devsecops/fastapi-app:${IMAGE_TAG:-latest}
    container_name: devsecops-app
    restart: unless-stopped
    networks:
      - devsecops-net
    ports:
      - "127.0.0.1:8000:8000"   # Écoute uniquement sur localhost (pas exposé directement)
    environment:
      - APP_VERSION=${APP_VERSION:-1.0.0}
      - BUILD_NUMBER=${IMAGE_TAG:-local}
      - GIT_COMMIT=${GIT_COMMIT:-unknown}
      - API_SECRET_TOKEN=${API_SECRET_TOKEN}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-http://localhost}
    # Limites de ressources (prévention DoS)
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.1'
          memory: 64M
    # Sécurité conteneur
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # ── Nginx Reverse Proxy (TLS termination) ────────────────────────────────
  nginx:
    image: nginx:1.25-alpine
    container_name: devsecops-nginx
    restart: unless-stopped
    networks:
      - devsecops-net
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      app:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE

  # ── Prometheus (monitoring) ──────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: devsecops-prometheus
    restart: unless-stopped
    networks:
      - devsecops-net
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.retention.time=15d'
      - '--web.enable-lifecycle'
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  # ── Grafana (tableaux de bord) ───────────────────────────────────────────
  grafana:
    image: grafana/grafana:10.4.0
    container_name: devsecops-grafana
    restart: unless-stopped
    networks:
      - devsecops-net
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_AUTH_ANONYMOUS_ENABLED=false
      - GF_SECURITY_DISABLE_GRAVATAR=true
    depends_on:
      - prometheus
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
